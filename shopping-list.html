<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쇼핑 리스트</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f0f4f8;
      --card: #fff;
      --shadow: rgba(0, 0, 0, 0.1);
      --title: #1a202c;
      --text: #1e293b;
      --text-muted: #94a3b8;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --divider: #f1f5f9;
      --hover: #f8fafc;
      --input-bg: #fff;
    }

    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --shadow: rgba(0, 0, 0, 0.4);
      --title: #f1f5f9;
      --text: #e2e8f0;
      --text-muted: #475569;
      --text-sub: #94a3b8;
      --border: #334155;
      --divider: #273549;
      --hover: #273549;
      --input-bg: #273549;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      transition: background 0.3s;
    }

    .container {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 24px var(--shadow);
      width: 100%;
      max-width: 480px;
      padding: 32px 28px;
      height: fit-content;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--title);
    }

    h1 span {
      color: #4f46e5;
    }

    .theme-btn {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 1rem;
      cursor: pointer;
      color: var(--text-sub);
      transition: border-color 0.2s, background 0.2s;
      line-height: 1;
    }

    .theme-btn:hover {
      border-color: #4f46e5;
      color: #4f46e5;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      background: var(--input-bg);
      color: var(--text);
      transition: border-color 0.2s, background 0.3s, color 0.3s;
    }

    .input-row input::placeholder {
      color: var(--text-muted);
    }

    .input-row input:focus {
      border-color: #4f46e5;
    }

    .input-row button {
      padding: 10px 18px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .input-row button:hover {
      background: #4338ca;
    }

    .summary {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .summary span {
      font-weight: 600;
      color: var(--text-sub);
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 10px;
      border-radius: 10px;
      transition: background 0.15s;
    }

    li:hover {
      background: var(--hover);
    }

    li + li {
      border-top: 1px solid var(--divider);
    }

    li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #4f46e5;
      cursor: pointer;
      flex-shrink: 0;
    }

    .item-name {
      flex: 1;
      font-size: 0.95rem;
      color: var(--text);
      transition: color 0.2s;
    }

    li.checked .item-name {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1.1rem;
      padding: 2px 6px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
      line-height: 1;
    }

    .delete-btn:hover {
      color: #ef4444;
      background: #fee2e2;
    }

    body.dark .delete-btn:hover {
      background: #3f1e1e;
    }

    .empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 32px 0;
    }

    .clear-btn {
      margin-top: 20px;
      width: 100%;
      padding: 9px;
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .clear-btn:hover {
      border-color: #ef4444;
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛒 쇼핑 <span>리스트</span></h1>
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="다크 모드 전환">🌙</button>
    </div>

    <div class="input-row">
      <input type="text" id="item-input" placeholder="아이템 입력..." maxlength="50" />
      <button onclick="addItem()">추가</button>
    </div>

    <div class="summary" id="summary"></div>

    <ul id="list"></ul>

    <button class="clear-btn" id="clear-btn" onclick="clearChecked()" style="display:none">
      완료된 항목 삭제
    </button>
  </div>

  <script>
    let items = JSON.parse(localStorage.getItem('shopping-items') || '[]');

    const isDark = localStorage.getItem('shopping-theme') === 'dark';
    if (isDark) document.body.classList.add('dark');
    document.getElementById('theme-btn').textContent = isDark ? '☀️' : '🌙';

    function toggleTheme() {
      const dark = document.body.classList.toggle('dark');
      localStorage.setItem('shopping-theme', dark ? 'dark' : 'light');
      document.getElementById('theme-btn').textContent = dark ? '☀️' : '🌙';
    }

    function save() {
      localStorage.setItem('shopping-items', JSON.stringify(items));
    }

    function render() {
      const list = document.getElementById('list');
      const summary = document.getElementById('summary');
      const clearBtn = document.getElementById('clear-btn');

      const total = items.length;
      const done = items.filter(i => i.checked).length;

      if (total === 0) {
        list.innerHTML = '<div class="empty">아직 아이템이 없습니다.</div>';
        summary.textContent = '';
        clearBtn.style.display = 'none';
        return;
      }

      summary.innerHTML = `총 <span>${total}</span>개 · 완료 <span>${done}</span>개`;
      clearBtn.style.display = done > 0 ? 'block' : 'none';

      list.innerHTML = items.map((item, idx) => `
        <li class="${item.checked ? 'checked' : ''}">
          <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggle(${idx})" />
          <span class="item-name">${escapeHtml(item.name)}</span>
          <button class="delete-btn" onclick="remove(${idx})" title="삭제">✕</button>
        </li>
      `).join('');
    }

    function addItem() {
      const input = document.getElementById('item-input');
      const name = input.value.trim();
      if (!name) return;

      items.unshift({ name, checked: false });
      input.value = '';
      save();
      render();
    }

    function toggle(idx) {
      items[idx].checked = !items[idx].checked;
      save();
      render();
    }

    function remove(idx) {
      items.splice(idx, 1);
      save();
      render();
    }

    function clearChecked() {
      items = items.filter(i => !i.checked);
      save();
      render();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    document.getElementById('item-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') addItem();
    });

    render();
  </script>
</body>
</html>
